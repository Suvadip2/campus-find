services:
  api:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER to the GitHub owner}/campus-find-api:latest
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - campus-find-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER to the GitHub owner}/campus-find-web:latest
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  campus-find-data:
